name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (unit + 4-node cluster integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: target/surefire-reports
      - uses: actions/upload-artifact@v4
        with:
          name: distribukv-jar
          path: target/distribukv.jar

  chaos-docker-compose:
    name: Failure scenarios (Docker Compose, 5 nodes)
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - run: bash scripts/chaos-test.sh compose
      - if: failure()
        run: docker compose logs --tail 200
      - if: always()
        run: docker compose down -v

  deploy-kubernetes:
    name: Deploy to Kubernetes (kind) & smoke test
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ghcr.io/prabuddh148/distribukv:latest .
      - uses: helm/kind-action@v1
        with:
          cluster_name: kv
      - run: kind load docker-image ghcr.io/prabuddh148/distribukv:latest --name kv
      - name: Deploy Kafka, MySQL and Redis
        run: |
          kubectl apply -f k8s/infra.yaml
          kubectl -n distribukv rollout status deployment/kafka --timeout=300s
          kubectl -n distribukv rollout status deployment/redis --timeout=300s
          kubectl -n distribukv rollout status statefulset/mysql --timeout=300s
      - run: kubectl apply -f k8s/distribukv.yaml
      - run: kubectl -n distribukv rollout status statefulset/distribukv --timeout=300s
      - run: bash scripts/k8s-smoke-test.sh
      - if: failure()
        run: |
          kubectl -n distribukv get pods -o wide
          kubectl -n distribukv logs statefulset/distribukv --tail 100 || true

  publish-image:
    name: Publish image to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [chaos-docker-compose, deploy-kubernetes]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/prabuddh148/distribukv:latest
            ghcr.io/prabuddh148/distribukv:${{ github.sha }}
