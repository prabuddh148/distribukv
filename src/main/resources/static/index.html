<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DistribuKV Dashboard</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1b1f24; --muted:#636c76; --line:#d8dee4; --up:#1a7f37; --down:#cf222e; --warn:#9a6700; --accent:#0969da; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0d1117; --card:#161b22; --ink:#e6edf3; --muted:#8d96a0; --line:#30363d; --up:#3fb950; --down:#f85149; --warn:#d29922; --accent:#4493f8; } }
  * { box-sizing: border-box; }
  body { margin:0; padding:24px 16px; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:1100px; margin:0 auto; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 20px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:12px; margin-bottom:24px; }
  .node { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; transition:border-color .2s, box-shadow .2s; }
  .node.replica { border-color:var(--accent); box-shadow:0 0 0 2px color-mix(in srgb, var(--accent) 30%, transparent); }
  .node header { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .node strong { font-size:15px; }
  .pill { font-size:11px; font-weight:600; padding:2px 8px; border-radius:99px; color:#fff; }
  .UP { background:var(--up); } .DOWN { background:var(--down); } .ISOLATED { background:var(--warn); }
  dl { display:grid; grid-template-columns:auto 1fr; gap:2px 10px; margin:0 0 10px; }
  dt { color:var(--muted); } dd { margin:0; text-align:right; font-variant-numeric:tabular-nums; }
  .tag { font-size:11px; color:var(--accent); font-weight:600; min-height:16px; }
  button { font:inherit; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:6px; padding:6px 12px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px; }
  input, select { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--ink); min-width:0; }
  input.key { flex:1 1 140px; } input.val { flex:2 1 200px; }
  pre { margin:0; background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:12px; overflow-x:auto; font-size:12.5px; min-height:120px; }
  .status { font-weight:600; margin-bottom:6px; }
  .ok { color:var(--up); } .err { color:var(--down); }
  footer { color:var(--muted); margin-top:16px; font-size:12px; }
</style>
</head>
<body>
<main>
  <h1>DistribuKV</h1>
  <p class="sub" id="sub">Connecting…</p>

  <section class="grid" id="nodes"></section>

  <section class="panel">
    <div class="row">
      <input class="key" id="key" value="user:42" aria-label="Key">
      <input class="val" id="value" value="alice" aria-label="Value">
      <select id="consistency" aria-label="Consistency">
        <option>STRONG</option><option>EVENTUAL</option>
      </select>
    </div>
    <div class="row">
      <button class="primary" data-op="PUT">PUT</button>
      <button data-op="GET">GET</button>
      <button data-op="DELETE">DELETE</button>
    </div>
    <div class="status" id="result-status">Send a request. The key's replicas are highlighted above.</div>
    <pre id="result"></pre>
  </section>
  <footer>Coordinated by the node serving this page. “Isolate” simulates a network partition around a node. Metrics: <a href="/actuator/prometheus">/actuator/prometheus</a></footer>
</main>
<script>
const $ = id => document.getElementById(id);
let replicas = [];

async function refresh() {
  try {
    const s = await (await fetch('/cluster/status')).json();
    $('sub').textContent = `Served by ${s.self} · ${s.nodes.length} nodes · N=${s.replicationFactor} · default ${s.defaultConsistency}`
      + ` · storage: ${s.stack.storage} · replication log: ${s.stack.replicationLog} · failure detection: ${s.stack.membership}`;
    $('nodes').innerHTML = s.nodes.map(n => {
      const isolated = n.stats && n.stats.isolated;
      const state = isolated ? 'ISOLATED' : (n.stats ? n.status : 'DOWN');
      return `<article class="node ${replicas.includes(n.id) ? 'replica' : ''}">
        <header><strong>${n.id}</strong><span class="pill ${state}">${state}</span></header>
        <div class="tag">${replicas.includes(n.id) ? 'replica #' + (replicas.indexOf(n.id) + 1) : ''}</div>
        <dl>
          <dt>keys</dt><dd>${n.stats ? n.stats.keys : '–'}</dd>
          <dt>hints queued</dt><dd>${n.stats ? n.stats.hintsPending : '–'}</dd>
          <dt>log lag</dt><dd>${n.stats && n.stats.replicationLagMs != null && n.stats.replicationLagMs >= 0 ? n.stats.replicationLagMs + ' ms' : '–'}</dd>
          <dt>ring share</dt><dd>${(n.primaryOwnership * 100).toFixed(1)}%</dd>
          <dt>last heartbeat</dt><dd>${n.id === s.self ? 'self' : n.lastSeenMsAgo + ' ms'}</dd>
        </dl>
        <button data-isolate="${n.id}" data-enabled="${!isolated}" ${n.stats ? '' : 'disabled'}>${isolated ? 'Heal' : 'Isolate'}</button>
      </article>`;
    }).join('');
  } catch (e) {
    $('sub').textContent = 'Cannot reach this node: ' + e;
  }
}

async function locate() {
  const key = $('key').value.trim();
  if (!key) return;
  const r = await fetch('/cluster/ring?key=' + encodeURIComponent(key));
  replicas = r.ok ? (await r.json()).replicas : [];
  refresh();
}

document.addEventListener('click', async e => {
  const op = e.target.dataset.op;
  const isolate = e.target.dataset.isolate;
  if (op) {
    const key = encodeURIComponent($('key').value.trim());
    const started = performance.now();
    const res = await fetch(`/kv/${key}?consistency=${$('consistency').value}`, {
      method: op,
      headers: { 'Content-Type': 'text/plain' },
      body: op === 'PUT' ? $('value').value : undefined
    });
    const ms = (performance.now() - started).toFixed(0);
    const text = await res.text();
    $('result-status').className = 'status ' + (res.ok ? 'ok' : 'err');
    $('result-status').textContent = `${op} → HTTP ${res.status} in ${ms} ms`;
    try { $('result').textContent = JSON.stringify(JSON.parse(text), null, 2); } catch { $('result').textContent = text; }
    locate();
  } else if (isolate) {
    await fetch(`/cluster/nodes/${isolate}/isolate?enabled=${e.target.dataset.enabled}`, { method: 'POST' });
    refresh();
  }
});
$('key').addEventListener('change', locate);
locate();
setInterval(refresh, 1000);
</script>
</body>
</html>
