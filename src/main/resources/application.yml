server:
  port: 8080
  shutdown: immediate

spring:
  application:
    name: distribukv
  mvc:
    # PUT bodies are raw values; don't let Spring parse them as form data.
    formcontent:
      filter:
        enabled: false
  task:
    scheduling:
      pool:
        size: 4
  # Kafka, Redis and MySQL are optional; their beans are created only when enabled under kv.*.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

kv:
  node-id: node1
  # Full, static cluster membership: id=baseUrl pairs (this node included).
  cluster: node1=http://localhost:8080
  replication-factor: 3
  virtual-nodes: 256
  default-consistency: STRONG
  data-dir: ./data
  fsync: false
  heartbeat-interval-ms: 500
  failure-timeout-ms: 2000
  request-timeout-ms: 1000
  hint-delivery-interval-ms: 1000
  chaos-enabled: true
  chaos-auto-heal-seconds: 0
  storage:
    type: log               # log | mysql
    mysql-url: jdbc:mysql://localhost:3306/?allowPublicKeyRetrieval=true&useSSL=false
    mysql-username: root
    mysql-password: ""
  kafka:
    enabled: false
    bootstrap-servers: localhost:9092
    topic: kv-replication
    partitions: 6
    topic-replicas: 1
  redis:
    enabled: false
    url: redis://localhost:6379
  public-demo:
    enabled: false
    requests-per-second: 10
    max-value-bytes: 4096

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # Redis is optional for correctness (HTTP heartbeat fallback), so it must not fail health checks.
    redis:
      enabled: false
  metrics:
    distribution:
      percentiles-histogram:
        kv.requests: true
      percentiles:
        kv.requests: 0.5,0.95,0.99

---
spring:
  config:
    activate:
      on-profile: json
logging:
  structured:
    format:
      console: ecs
