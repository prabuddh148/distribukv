apiVersion: v1
kind: Namespace
metadata:
  name: distribukv
---
# Headless service: gives every pod a stable DNS name (distribukv-0.distribukv, ...),
# which is what the static cluster membership list refers to.
apiVersion: v1
kind: Service
metadata:
  name: distribukv
  namespace: distribukv
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: distribukv
  ports:
    - name: http
      port: 8080
---
# Client-facing service: any node can coordinate any request.
apiVersion: v1
kind: Service
metadata:
  name: distribukv-client
  namespace: distribukv
spec:
  selector:
    app: distribukv
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: distribukv
  namespace: distribukv
spec:
  serviceName: distribukv
  replicas: 5
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: distribukv
  template:
    metadata:
      labels:
        app: distribukv
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: distribukv
          image: ghcr.io/prabuddh148/distribukv:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: KV_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KV_CLUSTER
              value: >-
                distribukv-0=http://distribukv-0.distribukv:8080,distribukv-1=http://distribukv-1.distribukv:8080,distribukv-2=http://distribukv-2.distribukv:8080,distribukv-3=http://distribukv-3.distribukv:8080,distribukv-4=http://distribukv-4.distribukv:8080
            - name: KV_REPLICATION_FACTOR
              value: "3"
            - name: KV_FSYNC
              value: "true"
            - name: SPRING_PROFILES_ACTIVE
              value: json
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
